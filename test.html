<!DOCTYPE html>
<html>
<head>
    <title>Farmers' Markets Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            padding: 0;
            background: #f8f9fa;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin: 20px 0;
            color: #2e7d32;
            font-weight: 700;
        }

        #map {
            height: 80vh;
            width: 90%;
            max-width: 1200px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        /* Tooltip style */
        .leaflet-tooltip {
            background-color: #fffbea;
            color: #5d4037;
            border: 1px solid #fdd835;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        }
    </style>
</head>
<body>
    <h1>🌱 Farmers' Markets by Country</h1>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        // Farmers' market data (hardcoded for now)
        const marketsData = [
            { country: "United States", markets: 8500, lat: 37.0902, lng: -95.7129 },
            { country: "Canada", markets: 1200, lat: 56.1304, lng: -106.3468 },
            { country: "France", markets: 900, lat: 46.2276, lng: 2.2137 },
            { country: "Germany", markets: 750, lat: 51.1657, lng: 10.4515 },
            { country: "Brazil", markets: 500, lat: -14.2350, lng: -51.9253 }
        ];

        // Initialize the map
        const map = L.map('map').setView([20, 0], 2);

        // Add OpenStreetMap tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Custom marker icon
        const greenIcon = L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/684/684908.png',
            iconSize: [32, 32],
            iconAnchor: [16, 32],
            popupAnchor: [0, -32]
        });

        // Add markers with tooltips
        marketsData.forEach(item => {
            L.marker([item.lat, item.lng], { icon: greenIcon })
                .addTo(map)
                .bindTooltip(
                    `<b>${item.country}</b><br>Markets: ${item.markets}`,
                    { permanent: false }
                );
        });
    </script>
</body>
</html>
